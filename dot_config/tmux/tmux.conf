# Prefix: Ctrl-a (screen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Shell
set -g default-shell /bin/zsh

# Indexing starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# History
set -g history-limit 50000

# True color + undercurl (Ghostty / modern terminals)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc:RGB"
set -as terminal-overrides ",xterm-256color:Tc:RGB"
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# No escape delay (important for vim/neovim)
set -sg escape-time 0

# Status bar
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M"
set -g status-left-length 20
setw -g window-status-current-style "bold"
setw -g window-status-current-format "#I:#W"
setw -g window-status-format "#I:#W"

# ---  Plugins (TPM)  ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'
