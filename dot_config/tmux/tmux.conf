# Prefix: Ctrl-a (screen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Shell
set -g default-shell /bin/zsh

# Indexing starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# History
set -g history-limit 50000

# Copy to the local clipboard over SSH/mosh (OSC 52)
set -g set-clipboard on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Key help: grouped cheat sheet instead of the full list-keys dump
# Any key closes it (a finished popup otherwise only closes on Esc or C-c)
bind ? display-popup -E -T " keys " -w 66 -h 26 "zsh -c 'cat ~/.config/tmux/keys.txt; read -sk1'"

# True color + undercurl (Ghostty / modern terminals)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc:RGB"
set -as terminal-overrides ",xterm-256color:Tc:RGB"
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# No escape delay (important for vim/neovim)
set -sg escape-time 0

# Status bar
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M"
set -g status-left-length 20
setw -g window-status-current-style "bold"
setw -g window-status-current-format "#I:#W"
setw -g window-status-format "#I:#W"

# Second status row: common keys, colored by group (tabs, splits, scroll/copy, session). C-a H hides or shows it.
set -g status 2
set -g status-format[1] "#[align=left,dim] ^a     #[nodim,bold,fg=blue]c#[nobold,dim,fg=default] new tab    #[nodim,bold,fg=blue]n p#[nobold,dim,fg=default] next/prev tab    #[nodim,bold,fg=blue]1-9#[nobold,dim,fg=default] go to tab      #[nodim,bold,fg=green]| -#[nobold,dim,fg=default] split    #[nodim,bold,fg=green]hjkl#[nobold,dim,fg=default] move    #[nodim,bold,fg=green]z#[nobold,dim,fg=default] zoom    #[nodim,bold,fg=green]x#[nobold,dim,fg=default] close split      #[nodim,bold,fg=yellow][#[nobold,dim,fg=default] scroll    #[nodim,bold,fg=yellow]v y#[nobold,dim,fg=default] copy    #[nodim,bold,fg=yellow]]#[nobold,dim,fg=default] paste      #[nodim,bold,fg=magenta]d#[nobold,dim,fg=default] detach    #[nodim,bold,fg=magenta]?#[nobold,dim,fg=default] help"
bind H if -F "#{==:#{status},2}" "set -g status on" "set -g status 2"

# ---  Plugins (TPM)  ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Save sessions every 15 min and restore them after a reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
