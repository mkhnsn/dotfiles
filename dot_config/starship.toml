# ~/.config/starship.toml

add_newline = false
command_timeout = 1000
continuation_prompt = '▶ '

format = """
$git_state\
$directory\
$git_branch\
$git_status\
$character"""

right_format = """
$git_commit\
$package\
$hostname\
${custom.git_email_warning}"""

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 3

[git_branch]
format = '[$branch(:$remote_branch)]($style)'
style = "red"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "red"
modified = "*"
conflicted = "!!"
staged = ' [++\($count\)](green)'
ahead = ' [⇡${count}](green bold)'
diverged = ' [⇡${ahead_count}](green bold) [⇣${behind_count}](red bold)'
behind = ' [⇣${count}](red bold)'

[git_commit]
format = '[$hash$tag]($style) '

# Shows warning when no repo-local email is set
[custom.git_email_warning]
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && ! git config --local --get user.email >/dev/null 2>&1 && git config --global --get user.email >/dev/null 2>&1"
command = "echo 'git config set user.email \"name@example.com\"'"
format = "[$output]($style) "
style = "yellow"

[character]
success_symbol = " [❯](bold green) "
error_symbol = " [✗ ❯](bold red) "

[hostname]
ssh_only = true
format = "[$hostname]($style)"
style = "bold dimmed white"