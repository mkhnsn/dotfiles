name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render templated scripts
        run: tests/render.sh

      - name: shellcheck
        run: |
          shellcheck -s bash tests/.build/mac-setup tests/.build/mac-setup-server dot_local/bin/executable_mac-defaults dot_local/bin/executable_3dx-sync
          shellcheck -S warning -s bash tests/*.sh install.sh

      - name: mac-setup tests (bash 3.2, as on macOS)
        run: docker run --rm -v "$PWD:/w" -w /w bash:3.2 bash tests/mac-setup.test.sh

      - name: mac-setup tests (bash 5)
        run: bash tests/mac-setup.test.sh

      - name: chezmoiignore tests (1Password files skipped when secrets can't be read)
        run: bash tests/chezmoiignore.test.sh

      - name: claude-sync tests
        run: bash tests/claude-sync.test.sh

      - name: cf-mcp-headers tests
        run: bash tests/cf-mcp-headers.test.sh

      - name: streamdeck-library tests
        run: python3 -I tests/streamdeck_library_test.py

      - name: app-prefs tests (and guard on committed settings)
        run: python3 -I tests/app_prefs_test.py

      - name: brew-why tests
        run: python3 -I tests/brew_why_test.py

      - name: BTT preset is normalized and keeps pinned settings
        run: python3 -I tests/btt_preset_test.py

      - name: Brewfile entries exist in Homebrew (formula vs cask)
        run: python3 -I tests/brewfile_check.py
