# ---- Hyper: Caps Lock (BTT, every keyboard) ---------------------------------------------------
# Caps Lock acts as ⌃⌥⇧⌘ while held, so a "⌃⌥⇧⌘<key>" entry here is a Hyper key. Hold Caps Lock
# alone (0.65 s) and release to toggle Caps Lock. Split: Hyper+1–5 work modes (macos/modes.toml),
# Hyper+0 and letters BTT named triggers (macos/btt/triggers.toml, read by shortcut-check) and
# menus (Space: ops menu), Hyper+B and Hyper+/ Bartender (below).
# Set Caps Lock to Caps Lock in System Settings > Keyboard > Modifier Keys, or BTT can't see it
# (mac-setup's capslock step checks that setting for every connected keyboard).
[[shortcut]]
keys = "⇪"
owner = "btt"
action = "Hyper key (⌃⌥⇧⌘); hold alone for Caps Lock"

# Set by hand in Bartender > Settings > Hotkeys (mac-setup's bartender_keys step).
[[shortcut]]
keys = "⌃⌥⇧⌘B"
owner = "bartender"
action = "Show hidden menu bar items"

[[shortcut]]
keys = "⌃⌥⇧⌘/"
owner = "bartender"
action = "Command Bar (click menu bar items from the keyboard)"

# ---- Calls -------------------------------------------------------------------------------------
# Mic mute (Hyper+M, and ⌃⌥⌘M for the Stream Deck's Mic key) and the camera keys (Hyper+V, and
# ⌃⌥⌘V for the Stream Deck's Camera key, in Zoom, Teams and Chrome for Meet) are named triggers:
# macos/btt/triggers.toml. Slack huddles: not yet (its video shortcut isn't confirmed). Zoom's
# Start/Stop Video is moved to ⌃⇧⌘V by hand (below), so ⇧⌘V is free for Raycast.
# Set by hand in Zoom › Settings › Keyboard Shortcuts › Start/Stop Video (default ⇧⌘V).
[[shortcut]]
keys = "⌃⇧⌘V"
owner = "zoom"
scope = "us.zoom.xos"
action = "Start/Stop Video (BTT's camera key sends this)"

# ---- AltTab (macos/prefs/com.lwouis.alt-tab-macos.plist) --------------------------------------
# Shortcut 1 replaces the macOS app switcher; shortcut 2 is AltTab's default.
[[shortcut]]
keys = "⌘⇥"
owner = "alttab"
action = "Window switcher (replaces the macOS app switcher)"

[[shortcut]]
keys = "⌥`"
owner = "alttab"
action = "Window switcher, current app"

# ---- Raycast (entered by hand; set in Raycast, readable through its MCP server) ---------------
# Read 2026-11-21 via raycast-settings. Window Management and Switch Windows have no hotkeys
# (cleared 2026-11-19): BTT and AltTab own those jobs.
[[shortcut]]
keys = "⌘Space"
owner = "raycast"
action = "Open Raycast (Spotlight's shortcut is off in macOS)"

[[shortcut]]
keys = "⌃⌘Space"
owner = "raycast"
action = "Emoji picker (replaces the macOS character viewer)"

[[shortcut]]
keys = "⇧⌘V"
owner = "raycast"
action = "Clipboard History (overrides apps' paste-as-plain-text ⇧⌘V)"
