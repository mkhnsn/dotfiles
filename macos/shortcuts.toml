# Every keyboard shortcut, in one place, with the app that owns it. Checked by `shortcut-check`
# (and by `make test`): two owners on the same keys in overlapping scopes is a conflict, a binding
# in a managed config that isn't listed here is undeclared, and a listed managed binding its
# config no longer has is stale.
#
# owner    btt | macos | alttab        read from their configs in this repo
#          raycast | macos-default | app-menus | <app>   entered by hand (source = "manual")
# scope    "global", or an app's bundle ID
# accepted a known, temporary conflict: the reason. It's reported as a warning, not a failure.
#
# Ownership (2026-11-19): window management is BTT (drag-to-snap and the ⌃⌥ keys), app switching
# is AltTab on ⌘Tab, the menu bar is Bartender, Raycast is the launcher and nothing else.

# ---- macOS system shortcuts set by mac-defaults (macos/symbolichotkeys.plist) ----------------
# Screenshots are swapped from Apple's defaults: plain = clipboard, ⌃ = file.
[[shortcut]]
keys = "⇧⌘3"
owner = "macos"
action = "Screenshot: screen to clipboard"

[[shortcut]]
keys = "⌃⇧⌘3"
owner = "macos"
action = "Screenshot: screen to file"

[[shortcut]]
keys = "⇧⌘4"
owner = "macos"
action = "Screenshot: area to clipboard"

[[shortcut]]
keys = "⌃⇧⌘4"
owner = "macos"
action = "Screenshot: area to file"

[[shortcut]]
keys = "⇧⌘/"
owner = "macos"
action = "Show Help menu"

# ---- macOS defaults the shortcuts file leaves alone (entered by hand) -------------------------
[[shortcut]]
keys = "⇧⌘5"
owner = "macos-default"
action = "Screenshot and recording options"

[[shortcut]]
keys = "⌃←"
owner = "macos-default"
action = "Move left a space"

[[shortcut]]
keys = "⌃→"
owner = "macos-default"
action = "Move right a space"

[[shortcut]]
keys = "⌃↑"
owner = "macos-default"
action = "Mission Control"

[[shortcut]]
keys = "⌃↓"
owner = "macos-default"
action = "Application windows"

[[shortcut]]
keys = "⌃⌘Q"
owner = "macos-default"
action = "Lock screen"

# ---- Standard app menu shortcuts (every app; entered by hand) ---------------------------------
[[shortcut]]
keys = "⌘W"
owner = "app-menus"
action = "Close tab/window"

[[shortcut]]
keys = "⇧⌘W"
owner = "app-menus"
action = "Close window (Chrome, VS Code, Ghostty, Preview)"
accepted = "BTT's ⇧⌘W display reset is being removed (no longer needed, 2026-11-19); drop this once the BTT preset no longer has it"

[[shortcut]]
keys = "⌘Q"
owner = "app-menus"
action = "Quit"

# ---- BetterTouchTool (macos/btt/Default.bttpreset) ---------------------------------------------
[[shortcut]]
keys = "⇧⌘W"
owner = "btt"
action = "Display reset to 5120×1440@120 (displayplacer) — to be removed"

# ---- AltTab (macos/prefs/com.lwouis.alt-tab-macos.plist) --------------------------------------
# Defaults until the ⌘Tab remap is exported: ⌥⇥ and ⌥`.
[[shortcut]]
keys = "⌥⇥"
owner = "alttab"
action = "Window switcher (moving to ⌘⇥)"

[[shortcut]]
keys = "⌥`"
owner = "alttab"
action = "Window switcher, current app"

# ---- Raycast (encrypted settings: entered by hand, set in Raycast) ----------------------------
# Raycast's window management and Switch Windows have no hotkeys: BTT and AltTab own those.
[[shortcut]]
keys = "⌘Space"
owner = "raycast"
action = "Open Raycast (Spotlight's shortcut is off in macOS)"

[[shortcut]]
keys = "⌃⌘Space"
owner = "raycast"
action = "Emoji picker (replaces the macOS character viewer)"

[[shortcut]]
keys = "⇧⌘6"
owner = "raycast"
action = "Window capture"
