# Every action the controls run, defined once as a BetterTouchTool named trigger, so a key, the
# Stream Deck, the Q6 knob, a mouse button, a touch gesture or BTT Mobile all fire the same thing.
#
# `trigger-check --write` generates the named triggers and their key bindings into
# macos/btt/Default.bttpreset; `btt-sync import` loads them into BTT. `trigger-check` (and
# `make test`) fails when an entry is invalid, can't be reached in every setup, or the preset is
# out of date. The keys here are part of the shortcut registry: `shortcut-check` reads them.
#
# name     the BTT named trigger; `trigger <name> <source>` fires it from a script or the
#          Stream Deck and logs it to ~/.local/state/triggers.log
# action   what it does, one line
# hint     one line, shown as a hint notification (`hints`); name its Hyper key
# run      a command in ~/.local/bin, or
# btt      a BTT action instead: { action = <BTTPredefinedActionType>, data = { ... } }; `fields`
#          for an action's own top-level keys (Send Shortcut to Specific App, 128; Move or
#          Resize Window to Custom Position and Size, 251)
# keys     the keys that fire it. Every trigger has a Hyper key (⌃⌥⇧⌘ + key, Caps Lock held):
#          the keyboard is the one surface in every setup. Extra keys are for senders that type
#          a shortcut (the Stream Deck's existing keys).
# fires    other surfaces bound to it: streamdeck, knob, mouse, touch, ipad
# group    the cheat sheet's section for its row (optional): a group's triggers, kept together
#          in this file, sit under one header. A trigger without one, after a group, sits
#          under that group's header too: put ungrouped triggers first.
# icon     an SF Symbol name shown at the left of its row (optional), like "mic.slash". After
#          adding one, run `trigger-check --measure` on a Mac (its width, for lining icons up)
# apps     bundle IDs it belongs to (optional; empty means every app). Its keys then work only in
#          those apps (the same key can do something else elsewhere), its cheat-sheet row shows
#          only there, and its hint shows the first time each day you switch to one of them;
#          without apps, it's a general hint.
#
# trigger-check also generates the cheat sheet (a BTT floating menu named "Hints" with a row per
# trigger) and the hints' BTT pieces from this file.
#
# Hyper keys reserved elsewhere: B and / Bartender, Space the ops menu,
# . and , (macOS sysdiagnose).

[[trigger]]
name = "mic-mute"
group = "Calls"
icon = "mic.slash"
action = "Mic: toggle mute (all apps)"
hint = "Hyper+M mutes or unmutes the mic in every app"
btt = { action = 585, data = { BTTMicMuteAlsoSetVolume = false, BTTMicMuteApplyToAllInputDevices = true } }
keys = ["⌃⌥⇧⌘M", "⌃⌥⌘M"]  # ⌃⌥⌘M: the Stream Deck's Mic key sends it (logged as key)
fires = ["streamdeck"]

# Camera: Hyper+V in a call app sends that app's own video shortcut (to the app in front). ⌃⌥⌘V
# is the Stream Deck's Camera key. Zoom's Start/Stop Video is moved to ⌃⇧⌘V by hand (mac-setup's
# zoom step), since its default ⇧⌘V is Raycast's Clipboard History.
[[trigger]]
name = "camera-zoom"
group = "Calls"
icon = "video"
action = "Camera: Zoom video on/off"
hint = "In a Zoom call, Hyper+V turns your camera on or off"
btt = { action = 128, fields = { BTTShortcutToSend = "59,55,56,9", BTTShortcutApp = "active app", BTTShortcutAppUnderCursor = "active app", BTTShortcutSwitchToAppFirst = "0", BTTLayoutIndependentActionChar = "active app" } }
keys = ["⌃⌥⇧⌘V", "⌃⌥⌘V"]
fires = ["streamdeck"]
apps = ["us.zoom.xos"]

[[trigger]]
name = "camera-teams"
group = "Calls"
icon = "video"
action = "Camera: Teams video on/off (sends ⇧⌘O)"
hint = "In a Teams call, Hyper+V turns your camera on or off"
btt = { action = 128, fields = { BTTShortcutToSend = "55,56,31", BTTShortcutApp = "active app", BTTShortcutAppUnderCursor = "active app", BTTShortcutSwitchToAppFirst = "0", BTTLayoutIndependentActionChar = "active app" } }
keys = ["⌃⌥⇧⌘V", "⌃⌥⌘V"]
fires = ["streamdeck"]
apps = ["com.microsoft.teams2"]

[[trigger]]
name = "camera-meet"
group = "Calls"
icon = "video"
action = "Camera: Meet video on/off (sends ⌘E)"
hint = "In a Meet call in Chrome, Hyper+V turns your camera on or off"
btt = { action = 128, fields = { BTTShortcutToSend = "55,14", BTTShortcutApp = "active app", BTTShortcutAppUnderCursor = "active app", BTTShortcutSwitchToAppFirst = "0", BTTLayoutIndependentActionChar = "active app" } }
keys = ["⌃⌥⇧⌘V", "⌃⌥⌘V"]
fires = ["streamdeck"]
apps = ["com.google.Chrome"]

[[trigger]]
name = "keep-awake"
group = "Mac"
icon = "cup.and.saucer.fill"
action = "Keep Awake: toggle (display and system stay on)"
hint = "Hyper+K keeps the Mac and its display awake until you press it again"
run = "keep-awake toggle"
keys = ["⌃⌥⇧⌘K"]

[[trigger]]
name = "cheat-sheet"
action = "Cheat sheet: every trigger, its keys, the next hint"
hint = "Hyper+H shows every trigger and its keys; click one to run it"
btt = { action = 388, data = { BTTMenuActionMenuID = "Hints" } }
keys = ["⌃⌥⇧⌘H"]

# Windows: act on the window in front. The ⌃⌥ keys are the ones Raycast used, kept for the
# Stream Deck's window buttons, which send them.
[[trigger]]
name = "window-left-half"
group = "Windows"
icon = "rectangle.lefthalf.filled"
action = "Window: left half"
hint = "Hyper+← puts the window in the left half of the screen"
btt = { action = 19 }
keys = ["⌃⌥⇧⌘←", "⌃⌥←"]

[[trigger]]
name = "window-right-half"
group = "Windows"
icon = "rectangle.righthalf.filled"
action = "Window: right half"
hint = "Hyper+→ puts the window in the right half of the screen"
btt = { action = 20 }
keys = ["⌃⌥⇧⌘→", "⌃⌥→"]

[[trigger]]
name = "window-maximize"
group = "Windows"
icon = "arrow.up.left.and.arrow.down.right"
action = "Window: maximize"
hint = "Hyper+↩ makes the window fill the screen"
btt = { action = 21 }
keys = ["⌃⌥⇧⌘↩", "⌃⌥↩"]

[[trigger]]
name = "window-left-third"
group = "Windows"
icon = "rectangle.leftthird.inset.filled"
action = "Window: left third"
hint = "Hyper+1 puts the window in the left third of the screen"
btt = { action = 108 }
keys = ["⌃⌥⇧⌘1", "⌃⌥D"]

[[trigger]]
name = "window-center-third"
group = "Windows"
icon = "rectangle.center.inset.filled"
action = "Window: center third"
hint = "Hyper+2 puts the window in the center third of the screen"
btt = { action = 109 }
keys = ["⌃⌥⇧⌘2", "⌃⌥F"]

[[trigger]]
name = "window-right-third"
group = "Windows"
icon = "rectangle.rightthird.inset.filled"
action = "Window: right third"
hint = "Hyper+3 puts the window in the right third of the screen"
btt = { action = 110 }
keys = ["⌃⌥⇧⌘3", "⌃⌥G"]

[[trigger]]
name = "window-left-two-thirds"
group = "Windows"
icon = "rectangle.lefthalf.inset.filled"
action = "Window: left two thirds"
hint = "Hyper+4 puts the window in the left two thirds of the screen"
btt = { action = 174 }
keys = ["⌃⌥⇧⌘4", "⌃⌥E"]

[[trigger]]
name = "window-right-two-thirds"
group = "Windows"
icon = "rectangle.righthalf.inset.filled"
action = "Window: right two thirds"
hint = "Hyper+5 puts the window in the right two thirds of the screen"
btt = { action = 175 }
keys = ["⌃⌥⇧⌘5", "⌃⌥T"]

[[trigger]]
name = "window-full-height"
group = "Windows"
icon = "arrow.up.and.down"
action = "Window: full height"
hint = "Hyper+↑ makes the window as tall as the screen, keeping its width"
btt = { action = 251, fields = { BTTActionMoveResizeName = "Full height", BTTActionMoveResizeConfig = '{"BTTMoveResizeVersion":3,"BTTActiveOrHoveredWindow":0,"BTTScreensToMove":0,"BTTOriginDisplay":1,"BTTDirectionToMove":0,"BTTChangeXOrigin":0,"BTTChangeYOrigin":1,"BTTOriginToUse":1,"BTTScreenOrigin":1,"BTTChangeYOriginRelative":0,"BTTNewYAbsolute":0,"BTTChangeWindowWidth":0,"BTTChangeWindowHeight":1,"BTTChangeHeightRelative":1,"BTTNewWindowHeightRelative":100,"BTTNewWindowHeightAbsoluteAddition":0,"BTTUseVisibleFrame":1,"BTTCareForStageManager":0}' } }
keys = ["⌃⌥⇧⌘↑", "⌃⌥⇧↩"]

[[trigger]]
name = "window-center"
group = "Windows"
icon = "scope"
action = "Window: center"
hint = "Hyper+↓ centers the window without resizing it"
btt = { action = 97 }
keys = ["⌃⌥⇧⌘↓"]

[[trigger]]
name = "window-desktop-left"
group = "Windows"
icon = "arrow.left.square"
action = "Window: one desktop left"
hint = "Hyper+[ moves the window one desktop to the left"
btt = { action = 151 }
keys = ["⌃⌥⇧⌘[", "⌃⌥⇧←"]

[[trigger]]
name = "window-desktop-right"
group = "Windows"
icon = "arrow.right.square"
action = "Window: one desktop right"
hint = "Hyper+] moves the window one desktop to the right"
btt = { action = 152 }
keys = ["⌃⌥⇧⌘]", "⌃⌥⇧→"]

[[trigger]]
name = "window-next-display"
group = "Windows"
icon = "display.2"
action = "Window: next display"
hint = "Hyper+N moves the window to the next display"
btt = { action = 47 }
keys = ["⌃⌥⇧⌘N"]
