# Every action the controls run, defined once as a BetterTouchTool named trigger, so a key, the
# Stream Deck, the Q6 knob, a mouse button, a touch gesture or BTT Mobile all fire the same thing.
#
# `trigger-check --write` generates the named triggers and their key bindings into
# macos/btt/Default.bttpreset; `btt-sync import` loads them into BTT. `trigger-check` (and
# `make test`) fails when an entry is invalid, can't be reached in every setup, or the preset is
# out of date. The keys here are part of the shortcut registry: `shortcut-check` reads them.
#
# name     the BTT named trigger; `trigger <name> <source>` fires it from a script or the
#          Stream Deck and logs it to ~/.local/state/triggers.log
# action   what it does, one line
# hint     one line, shown as a hint notification (`hints`); name its Hyper key
# run      a command in ~/.local/bin, or
# btt      a BTT action instead: { action = <BTTPredefinedActionType>, data = { ... } }
# keys     the keys that fire it. Every trigger has a Hyper key (⌃⌥⇧⌘ + key, Caps Lock held):
#          the keyboard is the one surface in every setup. Extra keys are for senders that type
#          a shortcut (the Stream Deck's existing keys).
# fires    other surfaces bound to it: streamdeck, knob, mouse, touch, ipad
# apps     bundle IDs it belongs to (optional; empty means every app). Its hint then shows the
#          first time each day you switch to one of them; without apps, it's a general hint.
# modes    work modes it belongs to (optional; #98)
#
# trigger-check also generates the cheat sheet (a BTT floating menu named "Hints" with a row per
# trigger) and the hints' BTT pieces from this file.
#
# Hyper keys reserved elsewhere: 1–5 work modes (#98), B and / Bartender, Space the ops menu,
# . and , (macOS sysdiagnose).

[[trigger]]
name = "mic-mute"
action = "Mic: toggle mute (all apps)"
hint = "Hyper+M mutes or unmutes the mic in every app"
btt = { action = 585, data = { BTTMicMuteAlsoSetVolume = false, BTTMicMuteApplyToAllInputDevices = true } }
keys = ["⌃⌥⇧⌘M", "⌃⌥⌘M"]  # ⌃⌥⌘M: the Stream Deck's Mic key sends it (logged as key)
fires = ["streamdeck"]

[[trigger]]
name = "keep-awake"
action = "Keep Awake: toggle (display and system stay on)"
hint = "Hyper+K keeps the Mac and its display awake until you press it again"
run = "keep-awake toggle"
keys = ["⌃⌥⇧⌘K"]

[[trigger]]
name = "mode-next"
action = "Mode: next work mode (placeholder until #98)"
hint = "Hyper+0 steps to the next work mode"
run = "mode next"
keys = ["⌃⌥⇧⌘0"]

[[trigger]]
name = "cheat-sheet"
action = "Cheat sheet: every trigger, its keys, the next hint"
hint = "Hyper+H shows every trigger and its keys; click one to run it"
btt = { action = 388, data = { BTTMenuActionMenuID = "Hints" } }
keys = ["⌃⌥⇧⌘H"]
