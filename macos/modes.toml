# Work modes: Hyper+1–5 (macos/btt/triggers.toml runs `mode <name>`). Read by `mode`.
#
# Docked (the ultrawide), a mode lives on a desktop of its own: Hyper+N goes to it, opens the
# mode's apps there and lays them out. A mode without one (never opened, or closed since) takes
# the desktop you're on, unless another mode has it; add a desktop in Mission Control for a fresh
# one. Nothing assumes a number of desktops; close a mode's apps or its desktop any time. Travel
# (the laptop, maybe the Espresso), each app goes full screen on its own space.
#
# [apps.<id>]   name        the app (as `open -a` takes it)
#               new_window  command that opens a new window here, for apps that can have one on
#                           each desktop (Chrome, VS Code); others are moved to the mode's desktop
# [[mode]]      name, title, key (Hyper+key)
#               layout      [app id, cell] for the ultrawide, in order; the first is the main app.
#                           A cell is columns like BTT's: "1-2/3" is the first two of three.
#               scene       a Home Assistant scene to turn on (optional)

[apps.vscode]
name = "Visual Studio Code - Insiders"
new_window = ["open", "-na", "Visual Studio Code - Insiders", "--args", "--new-window"]

[apps.chrome]
name = "Google Chrome"
new_window = ["open", "-na", "Google Chrome", "--args", "--new-window"]

[apps.fusion]
name = "Autodesk Fusion"

[apps.prusaslicer]
name = "PrusaSlicer"

[apps.outlook]
name = "Microsoft Outlook"

[apps.slack]
name = "Slack"

[apps.xtool]
name = "xTool Studio"

[[mode]]
name = "dev"
title = "Dev"
key = "1"
layout = [["vscode", "1-2/3"], ["chrome", "3/3"]]

[[mode]]
name = "cad"
title = "CAD"
key = "2"
layout = [["fusion", "1-2/3"], ["chrome", "3/3"]]

[[mode]]
name = "printing"
title = "3D printing"
key = "3"
layout = [["prusaslicer", "1/2"], ["chrome", "2/2"]]

[[mode]]
name = "comms"
title = "Comms"
key = "4"
layout = [["outlook", "1/2"], ["slack", "2/2"]]

[[mode]]
name = "laser"
title = "Laser"
key = "5"
layout = [["xtool", "1-2/3"], ["chrome", "3/3"]]
