# ---- Slack -------------------------------------------------------------------------------------
[[tip]]
name = "slack-jump"
text = "⌘K jumps to a channel or person"
apps = ["com.tinyspeck.slackmacgap"]

[[tip]]
name = "slack-unreads"
text = "⇧⌘A shows all unread messages"
