# Hints that aren't BTT triggers. `hints` shows them with the triggers' hints (macos/btt/triggers.toml)
# and the shortcut registry's (macos/shortcuts.toml), one a day in general and one a day per app.
# Their use can't be measured, so each stops after it has been shown 3 times. `hints check`
# (and `make test`) fails on a bad entry.
#
# [[tip]]   name   lowercase, digits and dashes; unique
#           text   the hint, one line: lead with the keys or the command
#           apps   bundle IDs it belongs to (optional; without it, it's a general hint)
# [shell]   apps     terminal apps the alias hints show in
#           aliases  the aliases in dot_config/shell/aliases.zsh worth a hint, in the order to show
#                    them ("In the shell, gst runs: git status -sb")
# One bad entry here drops every tip and alias hint until it's fixed; `hints check` says which.

[shell]
apps = ["com.mitchellh.ghostty", "com.apple.Terminal"]
aliases = ["gst", "gl", "gsw", "gup", "gpf", "gca", "ll", "treee"]

# ---- Terminal ----------------------------------------------------------------------------------
[[tip]]
name = "shell-cproj"
text = "In the shell, c picks a project from your repos and GitHub, and cds into it (cloning it first if needed)"
apps = ["com.mitchellh.ghostty", "com.apple.Terminal"]

[[tip]]
name = "tmux-cheat-sheet"
text = "In tmux, C-a ? shows its keys, grouped"
apps = ["com.mitchellh.ghostty", "com.apple.Terminal"]

# ---- Chrome ------------------------------------------------------------------------------------
[[tip]]
name = "chrome-reopen-tab"
text = "⇧⌘T reopens the tab you just closed"
apps = ["com.google.Chrome"]

[[tip]]
name = "chrome-search-tabs"
text = "⇧⌘A searches your open tabs"
apps = ["com.google.Chrome"]

[[tip]]
name = "chrome-address-bar"
text = "⌘L jumps to the address bar"
apps = ["com.google.Chrome"]

# ---- VS Code Insiders --------------------------------------------------------------------------
[[tip]]
name = "vscode-quick-open"
